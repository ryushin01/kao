name: Critical issue push

# 위험 등급 문제를 검사해 웹 푸시를 보내는 /api/cron/notify를 손으로 한 번 부를 때 씁니다.
# 5분마다 부르는 일은 Cloudflare Workers 크론(workers/notify-cron)이 합니다. GitHub 예약 실행은
# 2026-11-14 확인 때 5시간 넘게 한 번도 돌지 않아 예약을 뺐습니다(docs/deploy.md).
on:
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call /api/cron/notify
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$SITE_URL" ]; then echo "CRON_SECRET 또는 SITE_URL이 없어 건너뜁니다."; exit 0; fi
          curl -fsS --max-time 60 -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/notify"
