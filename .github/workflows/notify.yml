name: Critical issue push

# Vercel 무료 요금제의 크론은 하루 한 번뿐이라, 5분마다 위험 등급 문제를 검사해 웹 푸시를 보냅니다.
# 관제 화면이 열려 있으면 서버가 30초마다 함께 검사합니다. (GitHub의 예약 실행은 몇 분 늦을 수 있습니다)
# GitHub 예약 실행은 정각에 몰려 밀리거나 빠지므로, 매시 2분부터 5분마다(2, 7, 12, …, 57분) 돌립니다.
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call /api/cron/notify
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$SITE_URL" ]; then echo "CRON_SECRET 또는 SITE_URL이 없어 건너뜁니다."; exit 0; fi
          curl -fsS --max-time 60 -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/notify"
